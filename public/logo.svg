<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" fill="none">
  <style>
    /* 默认浅色模式样式 */
    .theme-color {
      stroke: #0b2742;
      fill: #0b2742;
    }
    
    /* 自动探测并切换至夜间/深色模式 */
    @media (prefers-color-scheme: dark) {
      .theme-color {
        stroke: #e2e8f0; /* 夜间模式下的线条颜色（浅灰蓝） */
        fill: #e2e8f0;   /* 夜间模式下的文字颜色（浅灰蓝） */
      }
    }
  </style>

  <!-- 给 path 和 text 加上统一的 class，并移除原本写死的 stroke 和 fill 属性 -->
  <path class="theme-color" d="m70.314 70.314 33.282 33.282m32.813 0 33.282-33.282m-99.377 99.377 33.282-33.282m32.813 0 33.282 33.282" stroke-width="16.875" stroke-linecap="round"/>
  
  <text class="theme-color" x="240" y="166" font-family="Noto Sans SC, Noto Sans, Microsoft YaHei, sans-serif" font-size="120" font-weight="500" letter-spacing="4">
    得心实验室
  </text>
</svg>
